<title>Сканер кулачкових дисків</title>

<script>

  // =====================================================================
  // OpenCV.js на основному потоці: ЛИШЕ запасний режим (див. fallbackToMainThread).
  // За замовчуванням OpenCV вантажиться у Worker, тож тут він не стартує.
  // opencv.js лежить поруч з цим файлом.
  // =====================================================================

  let openCvReady = false;

  function onOpenCvScriptError(ev) {
    console.error('[Disc Scanner] opencv.js не завантажився.', ev);
  }

  function onOpenCvScriptLoaded() {
    if (typeof cv === 'undefined') {
      console.error('[Disc Scanner] opencv.js відпрацював, але глобальна змінна cv не визначена.');
      return;
    }
    if (cv && typeof cv.then === 'function') {
      cv.then(function (resolvedCv) {
        window.cv = resolvedCv;
        openCvReady = true;
        console.log('[Disc Scanner] OpenCV готовий (Promise-збірка).');
      }).catch(function (err) {
        console.error('[Disc Scanner] cv Promise відхилено:', err);
      });
    } else {
      cv['onRuntimeInitialized'] = function () {
        openCvReady = true;
        console.log('[Disc Scanner] OpenCV готовий (onRuntimeInitialized).');
      };
    }
  }

</script>

/* Вікно камери: 150 px, вдвічі менше за прототип */
.scanner-window {

.scanner-window.active .scan-beam { display: block; }
@keyframes scan { 0% { top: 0; } 50% { top: calc(100% - 2px); } 100% { top: 0; } }

.scanner-corner {

<script id="engine">

/* =====================================================================
   ПАРАМЕТРИ
   ===================================================================== */

// Рамка-приціл: ширина рамки як частка меншої сторони вікна камери.
// Рамка квадратна з заокругленими кутами.
const GUIDE_WIDTH_RATIO = 1.0;   // 1.0 = приціл це все вікно камери (внутрішньої рамки немає)
const GUIDE_ASPECT_RATIO = 1.0;

// У скільки разів зона пошуку ширша за саму рамку (запас на неточне
// наведення). Усе, що поза цією зоною, детектор ігнорує.
const SCAN_ROI_MARGIN = 1.4;

/* ---- Геометрія диска. МАЄ ЗБІГАТИСЯ з генератором дисків ---- */

// 4 сектори по 90°, у кожному одна ямка на одній із 4 позицій з кроком 10°
const SECTORS = 4;
const SECTOR_DEG = 360 / SECTORS;
const POSITIONS = 4;
const POSITION_STEP_DEG = 10;
const FIRST_POSITION_DEG = 30;

// Сторона квадратного вирізу як частка радіуса диска
const SQUARE_RATIO = 0.5;

/* ---- Пошук диска й квадратного вирізу ---- */

// Найменша площа диска як частка площі кадру. 0.007 це диск шириною близько
// 9% кадру (за тестами на такому розмірі читання ще надійне). Менші диски
// ігноруються: на них ямки замалі, і зростає ризик прочитати хибний код.
const MIN_DISC_AREA_FRACTION = 0.007;

// Площа вирізу до площі контуру навколо нього: за геометрією це близько 0.08.
// Нижня межа низька навмисно: якщо до диска прилягає чужа графіка, контур
// навколо вирізу стає більшим за диск, а виріз лишається тим самим.
const HOLE_AREA_RATIO_MIN = 0.02;
const HOLE_AREA_RATIO_MAX = 0.16;

// Кандидат у виріз: його площа як частка площі кадру і мінімальне заповнення
// описаного прямокутника (квадрат, навіть повернутий на 45°, заповнює не менше 0.5)
const HOLE_MIN_AREA_FRACTION = 0.0004;
const HOLE_MAX_AREA_FRACTION = 0.05;
const HOLE_MIN_FILL = 0.4;

// Точність спрощення контуру вирізу до 4 кутів (частка периметра)
const HOLE_APPROX_EPS = 0.04;

/* ---- Профіль радіуса ---- */

// Диск вирівнюється за кутами квадрата в "вигляд спереду": радіус диска
// стає DST_R пікселів, сторона квадрата - DST_R * SQUARE_RATIO.
const DST_R = 200;
// Зображення вирівняного диска з запасом навколо (променями йдемо до 1.35 радіуса),
// щоб було видно, чи не прилягає до диска щось зайве
const DST_SIZE = Math.ceil(DST_R * 2 * 1.35);

// З якого радіуса (частка DST_R) йдемо від центра назовні. Це має бути
// всередині матеріалу: далі від кутів вирізу (0.35) і ближче за дно ямки (0.81).
const PROFILE_START_RATIO = 0.55;

// Ямка = місце, де радіус менший за цю частку звичайного радіуса диска.
// Повна глибина ямки близько 19%, поріг стоїть приблизно на третині глибини.
const PIT_THRESHOLD = 0.93;

// Звичайний радіус диска, виміряний у кадрі, має збігатися з розрахунковим
// у межах цієї частки (перевірка, що виріз справді належить такому диску)
const RADIUS_CHECK_TOL = 0.1;

// Форма справжньої ямки (виміряно на тестових кадрах: ширина 15-21°, глибина
// 0.80-0.87, зсув мінімуму від середини до 1.5°). Ямка, що виходить за ці межі,
// ймовірно, частково закрита чужою графікою, і її центр не можна брати для коду.
// Ширина ямки на порозі, у градусах:
const MIN_PIT_WIDTH_DEG = 14;
const MAX_PIT_WIDTH_DEG = 26;
// Глибина: найменший радіус ямки до звичайного радіуса
const PIT_DEPTH_MIN = 0.74;
const PIT_DEPTH_MAX = 0.88;
// На скільки градусів найглибша точка може відхилятися від середини ямки
const PIT_SYMMETRY_TOL_DEG = 3;

// Проміжки між ямками округлюються до кроку 10°. Якщо виміряний проміжок
// відрізняється від найближчого кроку більше ніж на це, кадр відкидається.
const GAP_QUANT_TOL_DEG = 4;
const GAP_MIN_DEG = 60;
const GAP_MAX_DEG = 120;

// Скільки кадрів поспіль має дати однаковий код, щоб його прийняти
const CONFIRM_STREAK = 3;

// Як часто аналізуємо кадр (мс): 200 = 5 кадрів на секунду
const SCAN_INTERVAL_MS = 200;

// Максимальний розмір кадру для аналізу в пікселях. Чим більший кадр, тим
// дрібніші ямки видно, а отже диск можна тримати далі від екрана.
const MAX_FRAME_SIZE = 960;

// Розмір ядра розмиття (непарне число). Менше розмиття лишає дрібні ямки чіткішими.
const BLUR_SIZE = 3;

// Крок уздовж променя при вимірюванні радіуса, у пікселях (менше за піксель:
// межа диска знаходиться з точністю до частки пікселя)
const PROFILE_STEP = 0.5;

// Якщо десь радіус перевищує звичайний більше ніж на цю частку, до диска в цьому
// напрямку щось прилягає (чужа графіка, рука). Такі кути вважаються "забрудненими":
// їм не довіряємо, а решту диска читаємо як звичайно.
const ATTACH_TOL = 0.15;

// Якщо забруднена більша частина кола (у градусах із 360), диск не читаємо
const MAX_DIRTY_DEG = 150;


// Звичайний радіус диска береться як медіана в такому околі кожного кута
// (у градусах в обидва боки). Окіл ширший за ямку, тому ямки на медіану не
// впливають, а повільні спотворення форми (неточне вирівнювання, об'єктив)
// медіана повторює, і вони не вважаються ямками.
const BASELINE_HALF_WINDOW_DEG = 70;

// Скільки найближчих до центра прицілу кандидатів перевіряємо за кадр
const MAX_CANDIDATES = 4;

/* =====================================================================
   ДОПОМІЖНІ ФУНКЦІЇ
   ===================================================================== */

/* =====================================================================
   РАМКА-ПРИЦІЛ
   Геометрія рахується від розміру вікна (W x H) у тих самих координатах,
   що й кадр для аналізу: кадр - це центральний квадрат відео, стиснутий
   до квадрата, тому рамка лежить на тому ж місці й у кадрі, й на екрані.
   ===================================================================== */

function getGuideGeometry(W, H) {
  const cx = W / 2;
  const cy = H / 2;
  const guideW = Math.min(W, H) * GUIDE_WIDTH_RATIO;
  let guideH = guideW * GUIDE_ASPECT_RATIO;
  const maxH = H * 0.94;
  if (guideH > maxH) guideH = maxH;
  const halfW = guideW / 2;
  const halfH = guideH / 2;
  return { cx, cy, halfW, halfH };
}

// Чи лежить точка (x, y) у зоні пошуку навколо рамки
function isInsideGuideRoi(x, y, W, H) {
  const g = getGuideGeometry(W, H);
  return Math.abs(x - g.cx) <= g.halfW * SCAN_ROI_MARGIN &&
         Math.abs(y - g.cy) <= g.halfH * SCAN_ROI_MARGIN;
}

/* =====================================================================
   ТАБЛИЦЯ ДИСКІВ
   Той самий перебір, що й у генераторі: для кожного диска рахуємо його
   відбиток (проміжки між ямками, найменший циклічний зсув) і запам'ятовуємо
   код диска (4 цифри). Це справжній номер диска: не залежить від порядку
   показу в генераторі. Для кожного відбитка код = перший знайдений
   представник, так само, як у генераторі.
   ===================================================================== */

// Проміжки між сусідніми ямками для заданого коду, у градусах
function gapsOfCode(code) {
  const centers = code.map((pos, s) => s * SECTOR_DEG + FIRST_POSITION_DEG + pos * POSITION_STEP_DEG);
  return centers.map((c, i) => (centers[(i + 1) % SECTORS] - c + 360) % 360);
}

// Відбиток: найменший (за рядком) серед усіх циклічних зсувів проміжків.
// Диск може лежати під будь-яким поворотом, відбиток від цього не змінюється.
function canonicalGapKey(gaps) {
  let best = null;
  for (let r = 0; r < gaps.length; r++) {
    const rotated = gaps.map((_, i) => gaps[(i + r) % gaps.length]).join(',');
    if (best === null || rotated < best) best = rotated;
  }
  return best;
}

function buildDiscCodeTable() {
  const table = {};
  const total = Math.pow(POSITIONS, SECTORS);
  for (let n = 0; n < total; n++) {
    const code = [];
    for (let s = 0; s < SECTORS; s++) {
      code.push(Math.floor(n / Math.pow(POSITIONS, s)) % POSITIONS);
    }
    const key = canonicalGapKey(gapsOfCode(code));
    if (!(key in table)) table[key] = code.join('');
  }
  return table;
}

const DISC_CODE_BY_KEY = buildDiscCodeTable();

/* =====================================================================
   ДЕТЕКТОР
   Кроки:
   1. Сірий, легке розмиття. Поріг Оцу рахується лише по зоні прицілу, тож
      чужа графіка за її межами не впливає на вибір порога. Для великої
      суцільної фігури це надійніше за adaptiveThreshold, який у середині
      рівної заливки не бачить жодних країв.
   2. findContours з ієрархією. Диск шукається за своїм квадратним вирізом:
      це контур-дірка, схожа на квадрат, у зоні прицілу. Так чужа графіка,
      що злилася з диском, не заважає знайти його. Кандидати йдуть від
      найближчого до центра прицілу, тож коли в кадрі кілька дисків,
      читається той, на який навели.
   3. Виріз має бути чотирикутником. За його 4 кутами диск вирівнюється
      у вигляд спереду (perspective).
   4. Від центра йдемо променями по колу й знаходимо радіус краю диска для
      кожного градуса (з точністю до частки пікселя). Де радіус помітно
      менший, там ямка. Де радіус більший за звичайний, до диска прилягає
      чужа графіка: такі кути ігноруються, решта диска читається.
   5. Проміжки між 4 ямками округлюються до 10°, з них відбиток і код.
   Усі матриці OpenCV створюються тут і звільняються в finally.
   ===================================================================== */

// Уточнює кути квадратного вирізу до часток пікселя.
// Чому це важливо: вирівнювання диска будується лише за цим невеликим квадратом,
// а диск удвічі більший. Помилка в 1-2 пікселі в кутах квадрата на краю диска
// виростає в кілька відсотків і спотворює профіль радіуса. Тому замість вершин
// approxPolyDP беремо точки контуру вздовж кожної з 4 сторін (без країв біля
// кутів, де контур заокруглений розмиттям), проводимо через них пряму методом
// найменших квадратів, а кути знаходимо як перетин сусідніх прямих.
// Повертає 4 точки або null, якщо щось пішло не так (тоді лишаються вершини approxPolyDP).
function refineSquareCorners(contourMat, verts) {
  const pts = contourMat.data32S;              // x0, y0, x1, y1, ...
  const total = pts.length / 2;
  if (total < 16) return null;

  // Індекс точки контуру, найближчої до кожної вершини
  const idx = verts.map(v => {
    let best = 0;
    let bestD = Infinity;
    for (let i = 0; i < total; i++) {
      const dx = pts[i * 2] - v.x;
      const dy = pts[i * 2 + 1] - v.y;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  });

  // Вершини мають йти по контуру одним колом: сума довжин сторін = весь контур
  let sum = 0;
  for (let k = 0; k < 4; k++) sum += (idx[(k + 1) % 4] - idx[k] + total) % total;
  if (sum !== total) return null;

  // Пряма для кожної сторони
  const lines = [];
  for (let k = 0; k < 4; k++) {
    const a = idx[k];
    const len = (idx[(k + 1) % 4] - a + total) % total;
    const from = Math.floor(len * 0.2);
    const to = Math.ceil(len * 0.8);
    let n = 0, mx = 0, my = 0;
    for (let j = from; j <= to; j++) {
      const i = (a + j) % total;
      mx += pts[i * 2]; my += pts[i * 2 + 1]; n++;
    }
    if (n < 4) return null;
    mx /= n; my /= n;
    let sxx = 0, sxy = 0, syy = 0;
    for (let j = from; j <= to; j++) {
      const i = (a + j) % total;
      const dx = pts[i * 2] - mx;
      const dy = pts[i * 2 + 1] - my;
      sxx += dx * dx; sxy += dx * dy; syy += dy * dy;
    }
    const ang = 0.5 * Math.atan2(2 * sxy, sxx - syy);    // напрям прямої (головна вісь точок)
    lines.push({ x: mx, y: my, vx: Math.cos(ang), vy: Math.sin(ang) });
  }

  // Кут k = перетин прямої (k-1) і прямої k
  const corners = [];
  for (let k = 0; k < 4; k++) {
    const l1 = lines[(k + 3) % 4];
    const l2 = lines[k];
    const det = -l1.vx * l2.vy + l2.vx * l1.vy;
    if (Math.abs(det) < 1e-6) return null;               // сторони майже паралельні
    const dx = l2.x - l1.x;
    const dy = l2.y - l1.y;
    const t = (-dx * l2.vy + l2.vx * dy) / det;
    const cx = l1.x + t * l1.vx;
    const cy = l1.y + t * l1.vy;
    // Захист: уточнений кут не може відлітати далеко від вершини approxPolyDP
    if (Math.hypot(cx - verts[k].x, cy - verts[k].y) > 6) return null;
    corners.push({ x: cx, y: cy });
  }
  return corners;
}

// Місцевий звичайний радіус для кожного кута: медіана радіусів в околі цього кута.
// Кути з dirty[i] = true (там до диска щось прилягає) у медіану не беруться.
function localBaseline(radii, dirty, fallback) {
  const base = new Array(360);
  for (let deg = 0; deg < 360; deg++) {
    const win = [];
    for (let j = -BASELINE_HALF_WINDOW_DEG; j <= BASELINE_HALF_WINDOW_DEG; j++) {
      const k = (deg + j + 360) % 360;
      if (radii[k] > 0 && !dirty[k]) win.push(radii[k]);
    }
    if (win.length < 15) { base[deg] = fallback; continue; }   // замало чистих кутів поруч
    win.sort((p, q) => p - q);
    base[deg] = win[Math.floor(win.length / 2)];
  }
  return base;
}

// Читає код диска за його квадратним вирізом (holeIdx). parentIdx - контур навколо
// вирізу. Повертає { ok, code } або { ok: false, reason }. Коли виріз підтверджено
// квадратом, ставить info.isDisc = true.
function decodeCandidate(blur, level, contourMats, holeIdx, parentIdx, info) {
  let approx, srcTri, dstTri, M, warped;
  try {
    const holeArea = cv.contourArea(contourMats[holeIdx]);
    const parentArea = cv.contourArea(contourMats[parentIdx]);
    const holeRatio = holeArea / parentArea;
    if (holeRatio < HOLE_AREA_RATIO_MIN || holeRatio > HOLE_AREA_RATIO_MAX) {
      return { ok: false, reason: 'виріз не того розміру' };
    }

    // Виріз -> 4 кути
    const peri = cv.arcLength(contourMats[holeIdx], true);
    approx = new cv.Mat();
    cv.approxPolyDP(contourMats[holeIdx], approx, HOLE_APPROX_EPS * peri, true);
    if (approx.rows !== 4 || !cv.isContourConvex(approx)) {
      return { ok: false, reason: 'виріз не схожий на квадрат' };
    }

    // Виріз підтверджено: цей кандидат справді диск. Якщо далі читання не вдасться,
    // сусідній диск замість нього читати не можна (інакше вийде чужий код).
    info.isDisc = true;

    const verts = [];
    for (let i = 0; i < 4; i++) verts.push({ x: approx.data32S[i * 2], y: approx.data32S[i * 2 + 1] });
    const pts = refineSquareCorners(contourMats[holeIdx], verts) || verts;
    const mx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
    const my = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;

    // Кути впорядковуємо за кутом навколо центра (за годинниковою на екрані).
    // Це не дає картинці "дзеркалитися" після вирівнювання. З якого кута
    // почати, неважливо: квадрат симетричний, а код від повороту не залежить.
    pts.sort((p, q) => Math.atan2(p.y - my, p.x - mx) - Math.atan2(q.y - my, q.x - mx));

    // Вирівнюємо сірий кадр: диск стає колом радіуса DST_R, виріз - квадратом
    const c = DST_SIZE / 2;
    const h = (DST_R * SQUARE_RATIO) / 2;
    srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
      pts[0].x, pts[0].y, pts[1].x, pts[1].y, pts[2].x, pts[2].y, pts[3].x, pts[3].y
    ]);
    dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
      c - h, c - h,  c + h, c - h,  c + h, c + h,  c - h, c + h
    ]);
    M = cv.getPerspectiveTransform(srcTri, dstTri);
    warped = new cv.Mat();
    cv.warpPerspective(blur, warped, M, new cv.Size(DST_SIZE, DST_SIZE),
                       cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255, 255, 255, 255));

    // ---- Профіль радіуса: для кожного градуса шукаємо край диска ----
    const data = warped.data;
    const maxR = DST_SIZE / 2 - 3;

    // Яскравість у довільній точці (білінійна інтерполяція між пікселями)
    const sample = (x, y) => {
      const x0 = Math.floor(x);
      const y0 = Math.floor(y);
      const fx = x - x0;
      const fy = y - y0;
      const i = y0 * DST_SIZE + x0;
      return data[i] * (1 - fx) * (1 - fy) + data[i + 1] * fx * (1 - fy) +
             data[i + DST_SIZE] * (1 - fx) * fy + data[i + DST_SIZE + 1] * fx * fy;
    };

    const radii = new Array(360);
    for (let deg = 0; deg < 360; deg++) {
      const cosA = Math.cos(deg * Math.PI / 180);
      const sinA = Math.sin(deg * Math.PI / 180);
      const at = (rr) => sample(c + rr * cosA, c + rr * sinA);

      let rr = DST_R * PROFILE_START_RATIO;
      if (at(rr) >= level) { radii[deg] = 0; continue; }   // стартова точка не на матеріалі: кут невідомий

      // Йдемо назовні, поки яскравість нижча за поріг (диск темний, фон світлий)
      let v0 = at(rr);
      let v1 = v0;
      while (rr + PROFILE_STEP < maxR) {
        v1 = at(rr + PROFILE_STEP);
        if (v1 >= level) break;
        rr += PROFILE_STEP;
        v0 = v1;
      }
      // Точніше положення межі: лінійно між двома останніми точками
      const frac = (v1 > v0) ? Math.min(1, Math.max(0, (level - v0) / (v1 - v0))) : 0;
      radii[deg] = rr + frac * PROFILE_STEP;
    }

    // Звичайний радіус диска = медіана по всіх відомих кутах
    const known = radii.filter(r => r > 0).sort((p, q) => p - q);
    if (known.length < 180) return { ok: false, reason: 'профіль диска пошкоджено' };
    const rRef = known[Math.floor(known.length / 2)];
    if (Math.abs(rRef / DST_R - 1) > RADIUS_CHECK_TOL) {
      return { ok: false, reason: 'пропорції диска не збігаються' };
    }

    // ---- Забруднені кути: там, де до диска прилягає чужа графіка ----
    // Спершу місцева норма за всіма кутами, потім кути, що помітно її перевищують,
    // позначаються забрудненими, і норма перераховується вже без них (двічі).
    let dirty = new Array(360).fill(false);
    let base = localBaseline(radii, dirty, rRef);
    for (let pass = 0; pass < 2; pass++) {
      dirty = radii.map((r, i) => r === 0 || r > base[i] * (1 + ATTACH_TOL));
      base = localBaseline(radii, dirty, rRef);
    }
    dirty = radii.map((r, i) => r === 0 || r > base[i] * (1 + ATTACH_TOL));
    if (dirty.filter(Boolean).length > MAX_DIRTY_DEG) {
      return { ok: false, reason: 'забагато чужої графіки навколо диска' };
    }

    // ---- Ямки: суцільні відрізки чистих кутів, де радіус менший за місцевий поріг ----
    const isPit = radii.map((r, i) => (!dirty[i] && r < base[i] * PIT_THRESHOLD));
    const start = isPit.indexOf(false);
    if (start < 0) return { ok: false, reason: 'ямки не знайдено' };

    // Рухаємось від градуса, що точно не в ямці, щоб кільце не розрізало ямку навпіл
    const centers = [];
    let runStart = -1;
    for (let k = 0; k <= 360; k++) {
      const inPit = k < 360 && isPit[(start + k) % 360];
      if (inPit && runStart < 0) runStart = k;
      if (!inPit && runStart >= 0) {
        const len = k - runStart;
        if (len >= 4) {          // коротші відрізки - дрібний шум
          // Перевіряємо форму ямки: ширина, глибина (найменший радіус
          // відносно норми) і симетрія (найглибша точка посередині)
          let rMin = Infinity;
          let minAt = 0;
          for (let t = 0; t < len; t++) {
            const a = (start + runStart + t) % 360;
            if (radii[a] < rMin) { rMin = radii[a]; minAt = t; }
          }
          const mid = (len - 1) / 2;
          const depth = rMin / base[(start + runStart + Math.floor(mid)) % 360];
          if (len < MIN_PIT_WIDTH_DEG || len > MAX_PIT_WIDTH_DEG ||
              depth < PIT_DEPTH_MIN || depth > PIT_DEPTH_MAX ||
              Math.abs(minAt - mid) > PIT_SYMMETRY_TOL_DEG) {
            return { ok: false, reason: 'форма ямки не збігається (частково закрита?)' };
          }
          centers.push(runStart + mid);
        }
        runStart = -1;
      }
    }
    if (centers.length !== SECTORS) {
      return { ok: false, reason: `ямок: ${centers.length} (потрібно ${SECTORS})` };
    }

    // ---- Проміжки -> відбиток -> код диска ----
    const q = [];
    for (let i = 0; i < SECTORS; i++) {
      const next = (i + 1 < SECTORS) ? centers[i + 1] : centers[0] + 360;
      const gap = next - centers[i];
      const snapped = Math.round(gap / POSITION_STEP_DEG) * POSITION_STEP_DEG;
      if (Math.abs(gap - snapped) > GAP_QUANT_TOL_DEG) return { ok: false, reason: 'проміжки між ямками неточні' };
      if (snapped < GAP_MIN_DEG || snapped > GAP_MAX_DEG) return { ok: false, reason: 'проміжок поза межами' };
      q.push(snapped);
    }
    if (q.reduce((a, b) => a + b, 0) !== 360) return { ok: false, reason: 'проміжки не складаються в коло' };

    const code = DISC_CODE_BY_KEY[canonicalGapKey(q)];
    if (!code) return { ok: false, reason: 'невідомий диск' };
    return { ok: true, code };

  } finally {
    [approx, srcTri, dstTri, M, warped].forEach(m => {
      if (m && typeof m.delete === 'function') m.delete();
    });
  }
}

function detectDisc(imgData, W, H) {
  if (!openCvReady) return { ok: false, reason: 'OpenCV ще завантажується...' };

  let src, gray, blur, roiMat, tmp, bin, contours, hierarchy;
  const contourMats = [];

  try {
    // ---- 1. Сірий, розмиття, поріг Оцу по зоні прицілу ----
    src = cv.matFromImageData(imgData);
    gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    blur = new cv.Mat();
    cv.GaussianBlur(gray, blur, new cv.Size(BLUR_SIZE, BLUR_SIZE), 0);

    const g = getGuideGeometry(W, H);
    const rx = Math.max(0, Math.floor(g.cx - g.halfW * SCAN_ROI_MARGIN));
    const ry = Math.max(0, Math.floor(g.cy - g.halfH * SCAN_ROI_MARGIN));
    const rw = Math.min(W - rx, Math.ceil(g.halfW * 2 * SCAN_ROI_MARGIN));
    const rh = Math.min(H - ry, Math.ceil(g.halfH * 2 * SCAN_ROI_MARGIN));
    roiMat = blur.roi(new cv.Rect(rx, ry, rw, rh));
    tmp = new cv.Mat();
    const level = cv.threshold(roiMat, tmp, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);

    // Диск (темний) стає білим на чорному
    bin = new cv.Mat();
    cv.threshold(blur, bin, level, 255, cv.THRESH_BINARY_INV);

    // ---- 2. Контури: шукаємо квадратні виїмки (дірки) ----
    contours = new cv.MatVector();
    hierarchy = new cv.Mat();
    cv.findContours(bin, contours, hierarchy, cv.RETR_TREE, cv.CHAIN_APPROX_NONE);
    const n = contours.size();
    for (let i = 0; i < n; i++) contourMats.push(contours.get(i));
    const hData = hierarchy.data32S;     // для кожного контуру: [наступний, попередній, перший вкладений, батько]

    const minParentArea = W * H * MIN_DISC_AREA_FRACTION;
    const cands = [];
    for (let i = 0; i < n; i++) {
      const parent = hData[i * 4 + 3];
      if (parent < 0) continue;                               // нас цікавлять лише дірки
      const area = cv.contourArea(contourMats[i]);
      if (area < W * H * HOLE_MIN_AREA_FRACTION || area > W * H * HOLE_MAX_AREA_FRACTION) continue;
      const rc = cv.boundingRect(contourMats[i]);
      const aspect = rc.width / rc.height;
      if (aspect < 0.5 || aspect > 2) continue;
      if (area / (rc.width * rc.height) < HOLE_MIN_FILL) continue;      // не схоже на квадрат
      const bx = rc.x + rc.width / 2;
      const by = rc.y + rc.height / 2;
      if (!isInsideGuideRoi(bx, by, W, H)) continue;
      if (cv.contourArea(contourMats[parent]) < minParentArea) continue;  // навколо надто мала фігура
      cands.push({ hole: i, parent, dist: Math.hypot(bx - g.cx, by - g.cy) });
    }
    if (cands.length === 0) return { ok: false, reason: 'диск не знайдено' };

    // Найближчий до центра прицілу іде першим: читаємо той диск, на який навели.
    // Кандидат, що не вийшов квадратом, пропускається. Перший справжній диск
    // читаємо, і якщо не вийшло, кадр відкидаємо: сусідній диск не читаємо.
    cands.sort((p, q) => p.dist - q.dist);
    let firstFail = null;
    for (let k = 0; k < Math.min(cands.length, MAX_CANDIDATES); k++) {
      const info = { isDisc: false };
      const res = decodeCandidate(blur, level, contourMats, cands[k].hole, cands[k].parent, info);
      if (res.ok || info.isDisc) return res;
      if (!firstFail) firstFail = res;       // причину показуємо для найближчого кандидата
    }
    return firstFail;

  } finally {
    // Звільняємо все, що створили, навіть якщо вище сталася помилка
    contourMats.forEach(m => { if (m && typeof m.delete === 'function') m.delete(); });
    [src, gray, blur, roiMat, tmp, bin, contours, hierarchy].forEach(m => {
      if (m && typeof m.delete === 'function') m.delete();
    });
  }
}


</script>
<script>

/* =====================================================================
   OpenCV У ОКРЕМОМУ ПОТОЦІ (Worker)
   Важке розпізнавання працює у Worker, тож анімація шестерень не гальмує.
   Якщо Worker недоступний або opencv.js у ньому не завантажився (наприклад,
   сторінку відкрито з файлу, а не з сервера), автоматично вмикається
   запасний режим: OpenCV на основному потоці, як раніше.
   Код движка один: його текст береться з <script id="engine">.
   ===================================================================== */

let worker = null;
let workerMode = false;     // true: розпізнаємо у Worker
let workerReady = false;    // OpenCV у Worker ініціалізовано
let pending = null;         // кадр, що зараз у Worker: { id, resolve }
let frameSeq = 0;

// Тіло Worker. Перетворюється на текст і запускається в самому Worker
// слідом за кодом движка, тому openCvReady і detectDisc там уже є.
function workerMain() {
  self.onmessage = function (e) {
    const m = e.data;
    if (m.type === 'init') {
      try {
        importScripts(m.url);
      } catch (err) {
        self.postMessage({ type: 'fail', reason: String(err) });
        return;
      }
      if (typeof cv === 'undefined') {
        self.postMessage({ type: 'fail', reason: 'cv не визначений' });
        return;
      }
      const markReady = function () {
        openCvReady = true;
        self.postMessage({ type: 'ready' });
      };
      if (cv && typeof cv.then === 'function') {
        cv.then(function (resolved) { self.cv = resolved; markReady(); })
          .catch(function (err) { self.postMessage({ type: 'fail', reason: String(err) }); });
      } else {
        cv['onRuntimeInitialized'] = markReady;
      }
      return;
    }
    if (m.type === 'frame') {
      let det;
      try {
        det = detectDisc({ data: new Uint8ClampedArray(m.buf), width: m.size, height: m.size }, m.size, m.size);
      } catch (err) {
        det = { ok: false, reason: 'помилка розпізнавання' };
      }
      self.postMessage({ type: 'result', id: m.id, det: det });
    }
  };
}

function startWorker() {
  try {
    const src = 'let openCvReady = false;\n' +
                document.getElementById('engine').textContent +
                '\n(' + workerMain.toString() + ')();';
    const blobUrl = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    worker = new Worker(blobUrl);
    worker.onmessage = onWorkerMessage;
    worker.onerror = (e) => {
      console.error('[Disc Scanner] Worker впав:', e.message || e);
      fallbackToMainThread();
    };
    workerMode = true;
    worker.postMessage({ type: 'init', url: new URL('opencv.js', document.baseURI).href });
  } catch (err) {
    console.error('[Disc Scanner] Worker недоступний:', err);
    fallbackToMainThread();
  }
}

function onWorkerMessage(e) {
  const m = e.data;
  if (m.type === 'ready') {
    workerReady = true;
    console.log('[Disc Scanner] OpenCV готовий (Worker).');
  } else if (m.type === 'fail') {
    console.error('[Disc Scanner] OpenCV у Worker не запустився:', m.reason);
    fallbackToMainThread();
  } else if (m.type === 'result' && pending && pending.id === m.id) {
    const p = pending;
    pending = null;
    p.resolve(m.det);
  }
}

let fallbackStarted = false;
function fallbackToMainThread() {
  if (fallbackStarted) return;
  fallbackStarted = true;
  workerMode = false;
  workerReady = false;
  if (worker) { worker.terminate(); worker = null; }
  if (pending) {
    const p = pending;
    pending = null;
    p.resolve({ ok: false, reason: 'перезапуск розпізнавання...' });
  }
  console.log('[Disc Scanner] Запасний режим: OpenCV на основному потоці.');
  const s = document.createElement('script');
  s.async = true;
  s.src = 'opencv.js';
  s.onload = onOpenCvScriptLoaded;
  s.onerror = onOpenCvScriptError;
  document.head.appendChild(s);
}

// Розпізнавання одного кадру (Promise з результатом detectDisc)
function runDetect(imgData, size) {
  if (!workerMode) return Promise.resolve(detectDisc(imgData, size, size));
  if (!workerReady) return Promise.resolve({ ok: false, reason: 'OpenCV ще завантажується...' });
  return new Promise((resolve) => {
    const id = ++frameSeq;
    const timer = setTimeout(() => {
      if (pending && pending.id === id) {
        pending = null;
        resolve({ ok: false, reason: 'розпізнавання не відповідає' });
      }
    }, 8000);
    pending = { id, resolve: (det) => { clearTimeout(timer); resolve(det); } };
    // Буфер передається у Worker без копіювання
    worker.postMessage({ type: 'frame', id: id, size: size, buf: imgData.data.buffer }, [imgData.data.buffer]);
  });
}

/* =====================================================================
   КАМЕРА І ЦИКЛ КАДРІВ
   Цикл послідовний: наступний кадр береться лише після того, як
   попередній розпізнано (кадри не накопичуються).
   ===================================================================== */

let camStream = null;      // потік з камери
let scanCanvas = null;     // один канвас для кадрів, створюється один раз
let scanCtx = null;
let scanToken = 0;         // змінюється при зупинці: застарілі відповіді відкидаються

let scanning = false;      // аналіз кадрів іде лише у стані "scanning"
let lastCode = null;       // останній розпізнаний код
let streak = 0;            // скільки кадрів поспіль він повторюється

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// Повертає '' якщо камеру запущено, інакше текст помилки
async function startCamera() {
  if (camStream) return '';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return 'Камера доступна лише в браузері з підтримкою камери та через https або localhost.';
    }
    const video = document.getElementById('camVideo');
    // Задня камера, якщо є; кадр бажаний якомога більший (центральний квадрат
    // з нього йде в аналіз)
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = camStream;
    await new Promise((resolve) => {
      if (video.readyState >= 1) { resolve(); return; }
      video.onloadedmetadata = () => resolve();
    });
    await video.play();

    // Якщо систему чи користувач вимкнули камеру посеред сканування
    camStream.getVideoTracks().forEach((t) => {
      t.addEventListener('ended', () => abortScan('Камеру вимкнено. Запусти сканування ще раз.'));
    });

    startScanLoop();
    return '';
  } catch (e) {
    teardownCamera();
    if (e.name === 'NotAllowedError') return 'Немає доступу до камери. Дозвольте його в налаштуваннях браузера.';
    if (e.name === 'NotFoundError') return 'Камеру не знайдено.';
    return 'Не вдалося запустити камеру: ' + (e.message || e.name);
  }
}

function teardownCamera() {
  stopScanLoop();
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
  const video = document.getElementById('camVideo');
  video.pause();
  video.srcObject = null;
}

function startScanLoop() {
  const tok = ++scanToken;
  (async () => {
    while (tok === scanToken) {
      const t0 = performance.now();
      try { await scanOnce(tok); } catch (e) { console.error('[Disc Scanner]', e); }
      if (tok !== scanToken) break;
      await sleep(Math.max(0, SCAN_INTERVAL_MS - (performance.now() - t0)));
    }
  })();
}
function stopScanLoop() { scanToken++; }

// Один крок циклу: центральний квадрат відео -> канвас -> детектор
async function scanOnce(tok) {
  if (!scanning) return;
  const video = document.getElementById('camVideo');
  if (!camStream || video.readyState < 2) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return;

  // Беремо центральний квадрат відео (саме його видно у вікні камери)
  const sSize = Math.min(vw, vh);
  const size = Math.min(sSize, MAX_FRAME_SIZE);
  const sx = (vw - sSize) / 2;
  const sy = (vh - sSize) / 2;

  if (!scanCanvas) {
    scanCanvas = document.createElement('canvas');
    scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
  }
  scanCanvas.width = size;
  scanCanvas.height = size;
  scanCtx.drawImage(video, sx, sy, sSize, sSize, 0, 0, size, size);
  const imgData = scanCtx.getImageData(0, 0, size, size);

  const det = await runDetect(imgData, size);
  if (tok !== scanToken || !scanning) return;     // поки чекали, сканування могли зупинити

  // Не розпізнано: скидаємо лічильник і показуємо, на чому застрягли
  if (!det.ok) {
    lastCode = null;
    streak = 0;
    setProgress(0);
    return;
  }

  // Розпізнано: приймаємо, лише коли той самий код тримається кілька кадрів поспіль
  if (det.code === lastCode) {
    streak++;
  } else {
    lastCode = det.code;
    streak = 1;
  }
  setProgress(Math.min(1, streak / CONFIRM_STREAK));
  if (streak >= CONFIRM_STREAK) finishScan(det.code);
}

/* =====================================================================
   ІНТЕРФЕЙС: ШЕСТЕРНІ, СЛАЙДЕР, ПЕРЕХОДИ
   Стани: idle (головна шестерня внизу, у зчепленні з нижньою парою) ->
   launching (летить вгору, зчіплюється з верхньою парою, слайдер везе
   поле вліво, камеру вправо) -> scanning -> returning (слайдер назад,
   шестерня відскакує вниз і зчіплюється з нижньою парою) -> idle.
   Зубці зчіплюються по-справжньому: кут головної шестерні при посадці
   підганяється так, щоб зуби входили у западини сусідніх шестерень.
   ===================================================================== */

const GEAR_MODULE = 3.75;
const MAIN_TEETH = 16, MAIN_PITCH = MAIN_TEETH * GEAR_MODULE, HOME_Y = 250;
const TOOTH_STEP = 360 / MAIN_TEETH;       // 22.5 градуса: період зубців головної шестерні
const IDLE_SPEED = 0.3, SCAN_SPEED = 0.6;  // градусів за кадр
const SLIDE_ROT = 150;                     // на скільки градусів повертається шестерня за час слайду
const VB = { y: -450, w: 620, h: 900 };    // має збігатися з viewBox у розмітці

const WINDOW_SIZE = 220;                   // сторона вікна камери, px
const SLOT_H_MAX = WINDOW_SIZE + 30;       // висота верхнього слота
const CORNER_TRAVEL_PX = 5;                // наскільки далі від рамки стартують кутники

// Нижня пара (як було). offset - фаза зубців у зчепленні з головною шестернею внизу
const BOTTOM = [
  { id: 'gear2', teeth: 8,  x: 81.5, y: 290,   offset: 22.5 },
  { id: 'gear3', teeth: 12, x: -93,  y: 301.5, offset: 15 }
];
// Верхня пара: дзеркальна, стоїть над головною шестернею, коли вона зверху.
// x, y, offset рахуються в layout()
const TOP = [
  { id: 'gearT2', teeth: 8,  dx: 81.5, dy: -40,   axis: 'axT2', dot: 'centerT2' },
  { id: 'gearT3', teeth: 12, dx: -93,  dy: -51.5, axis: 'axT3', dot: 'centerT3' }
];

let state = 'idle';
let mainY = HOME_Y, mainA = 0;     // положення й кут головної шестерні
let botA = 0, topA = 0;            // "ведучі кути" нижньої і верхньої пар
let botShift = 0, topShift = 0;
let bottomCoupled = true, topCoupled = false;
let topLandY = -100;               // де головна шестерня стає під верхню пару
let slideP = 0;                    // 0: видно поле, 1: видно камеру
let pointerDown = false, pointerStartY = 0;

const $ = (id) => document.getElementById(id);
const gearSvg = $('gearSvg'), gear1 = $('gear1'), center1 = $('center1');
const axisBottom = $('axisGroup'), axisTop = $('axisTop');
const infoCard = $('infoCard'), scannerWindow = $('scannerWindow');
const topSlot = $('topSlot'), stage = $('stage');

const wait = (ms) => new Promise(r => setTimeout(r, ms));
function tween(ms, step) {
  return new Promise((resolve) => {
    const t0 = performance.now();
    (function frame(now) {
      const p = Math.min((now - t0) / ms, 1);
      step(p);
      if (p < 1) requestAnimationFrame(frame); else resolve();
    })(t0);
  });
}
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = (t) => { const c1 = 0.45, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

// Найближчий кут, не менший за min (або не більший за max), що збігається з ref по зубцю
const alignedUp = (min, ref) => ref + TOOTH_STEP * Math.ceil((min - ref) / TOOTH_STEP);
const alignedDown = (max, ref) => ref + TOOTH_STEP * Math.floor((max - ref) / TOOTH_STEP);

// Фаза зубців малої шестерні, щоб вона зчіплювалася з головною (кут 0)
// у напрямку (dx, dy) від центра головної
function meshOffset(teeth, dx, dy) {
  const theta = Math.atan2(dy, dx) * 180 / Math.PI;
  const off = ((MAIN_TEETH + teeth) * theta + 180 * teeth - 90) / teeth;
  const period = 360 / teeth;
  return ((off % period) + period) % period;
}

function generateGearPath(cx, cy, pitchRadius, module, teethCount, holeRadius) {
  const angleStep = (Math.PI * 2) / teethCount;
  const outerRadius = pitchRadius + module * 0.8;
  const innerRadius = pitchRadius - module * 1.0;
  const toothWidth = angleStep * 0.25;
  const points = [];
  for (let i = 0; i < teethCount; i++) {
    const a = i * angleStep;
    points.push(`${(cx + innerRadius * Math.cos(a)).toFixed(2)},${(cy + innerRadius * Math.sin(a)).toFixed(2)}`);
    points.push(`${(cx + outerRadius * Math.cos(a + toothWidth)).toFixed(2)},${(cy + outerRadius * Math.sin(a + toothWidth)).toFixed(2)}`);
    points.push(`${(cx + outerRadius * Math.cos(a + 2 * toothWidth)).toFixed(2)},${(cy + outerRadius * Math.sin(a + 2 * toothWidth)).toFixed(2)}`);
    points.push(`${(cx + innerRadius * Math.cos(a + 3 * toothWidth)).toFixed(2)},${(cy + innerRadius * Math.sin(a + 3 * toothWidth)).toFixed(2)}`);
  }
  const outerPath = `M ${points.join(' L ')} Z`;
  const holePath = `M ${cx - holeRadius},${cy} A ${holeRadius},${holeRadius} 0 1,0 ${cx + holeRadius},${cy} A ${holeRadius},${holeRadius} 0 1,0 ${cx - holeRadius},${cy} Z`;
  return `${outerPath} ${holePath}`;
}
const setGearPath = (id, x, y, teeth) => {
  const r = teeth * GEAR_MODULE;
  $(id).setAttribute('d', generateGearPath(x, y, r, GEAR_MODULE, teeth, r * 0.35));
};

/* ---- Координати: екран <-> viewBox шестерень ---- */
function svgMetrics() {
  const r = gearSvg.getBoundingClientRect();
  const s = Math.min(r.width / VB.w, r.height / VB.h);
  return { r, s, offY: (r.height - VB.h * s) / 2 };
}
function screenYToSvg(y) {
  const m = svgMetrics();
  return (y - m.r.top - m.offY) / m.s + VB.y;
}

/* ---- Слайдер: поле їде вліво, камера в'їжджає справа (p: 0 -> 1) ---- */
// Прогрес розпізнавання 0..1: кутники під'їжджають до рамки
function setProgress(k) {
  scannerWindow.style.setProperty('--k', k.toFixed(2));
}

function setSlide(p) {
  slideP = p;
  const off = window.innerWidth / 2 + 230;
  infoCard.style.transform = `translateX(${(-p * off).toFixed(1)}px)`;
  scannerWindow.style.transform = `translateX(${((1 - p) * off).toFixed(1)}px)`;
}

/* ---- Розкладка: верхній слот, розмір вікна, верхня пара шестерень ---- */
function layout() {
  const m = svgMetrics();
  topSlot.style.setProperty('--slot-top', Math.max(10, Math.round(window.innerHeight * 0.05)) + 'px');
  topSlot.style.setProperty('--slot-h', SLOT_H_MAX + 'px');
  // Слот не опускається нижче рівня, де головна шестерня ще не наїжджає на нижню пару
  const yMax = m.r.top + m.offY + (78 - VB.y) * m.s;
  const H = Math.max(120, Math.min(SLOT_H_MAX, yMax - topSlot.getBoundingClientRect().top));
  topSlot.style.setProperty('--slot-h', H + 'px');
  topSlot.style.setProperty('--win', Math.min(WINDOW_SIZE, H - 24) + 'px');

  topLandY = screenYToSvg(topSlot.getBoundingClientRect().bottom) + 112;
  TOP.forEach((g) => {
    g.x = g.dx;
    g.y = topLandY + g.dy;
    g.offset = meshOffset(g.teeth, g.dx, g.dy);
    setGearPath(g.id, g.x, g.y, g.teeth);
    const ax = $(g.axis);
    ax.setAttribute('x1', 0); ax.setAttribute('y1', topLandY);
    ax.setAttribute('x2', g.x); ax.setAttribute('y2', g.y);
    $(g.dot).setAttribute('cx', g.x); $(g.dot).setAttribute('cy', g.y);
  });
  if (topCoupled) mainY = topLandY;
  setSlide(slideP);
}

/* ---- Малювання шестерень ---- */
// Атрибут виставляється лише коли значення змінилося (нерухомі шестерні не чіпаємо)
function setAttr(el, name, value) {
  const key = '_' + name;
  if (el[key] !== value) { el[key] = value; el.setAttribute(name, value); }
}
function render() {
  setAttr(gear1, 'transform', `translate(0 ${(mainY - HOME_Y).toFixed(2)}) rotate(${mainA.toFixed(2)} 0 ${HOME_Y})`);
  setAttr(center1, 'cy', mainY.toFixed(2));
  BOTTOM.forEach((g) => {
    const a = g.offset - (MAIN_TEETH / g.teeth) * botA;
    setAttr($(g.id), 'transform', `rotate(${a.toFixed(2)} ${g.x} ${g.y})`);
  });
  TOP.forEach((g) => {
    const a = g.offset - (MAIN_TEETH / g.teeth) * topA;
    setAttr($(g.id), 'transform', `rotate(${a.toFixed(2)} ${g.x} ${g.y})`);
  });
}

function frame() {
  if (state === 'idle' && !pointerDown) mainA += IDLE_SPEED;
  else if (state === 'scanning') mainA += SCAN_SPEED;
  if (bottomCoupled) botA = mainA - botShift;   // у зчепленні пара крутиться разом з головною
  if (topCoupled) topA = mainA - topShift;
  render();
  requestAnimationFrame(frame);
}

function showCard(title, desc, code) {
  $('cardTitle').textContent = title;
  $('cardDesc').textContent = desc;
  const c = $('cardCode');
  if (code) { c.textContent = code; c.hidden = false; } else { c.hidden = true; }
}
function setGearLabel() {
  gear1.setAttribute('aria-label', state === 'scanning' ? 'Вимкнути камеру' : 'Запустити сканування');
}

/* ---- Запуск: шестерня летить угору, зчіплюється, слайдер везе камеру ---- */
async function launch() {
  if (state !== 'idle') return;
  state = 'launching';
  bottomCoupled = false;                          // нижня пара зупиняється
  axisBottom.classList.add('fade-out');

  const y0 = mainY, a0 = mainA;
  const aEnd = alignedUp(a0 + 300, topA);         // у фазі з верхньою парою
  await tween(950, (p) => {
    const e = easeOutCubic(p);
    mainY = y0 + (topLandY - y0) * e;
    mainA = a0 + (aEnd - a0) * e;
  });
  mainY = topLandY; mainA = aEnd;
  topShift = mainA - topA;                        // зчеплення
  topCoupled = true;
  axisTop.classList.remove('fade-out');

  const a1 = mainA;
  await tween(700, (p) => {                       // слайдер у такт обертанню
    const e = easeInOut(p);
    setSlide(e);
    mainA = a1 + SLIDE_ROT * e;
  });
  setSlide(1);
  scannerWindow.classList.add('active');

  const err = await startCamera();
  if (err) { await endSession('Камера недоступна', err); return; }

  lastCode = null;
  streak = 0;
  state = 'scanning';
  setGearLabel();
  scanning = true;
  setProgress(0);
}

/* ---- Кінець (результат, скасування, помилка): слайдер назад, шестерня
        відскакує вниз і зчіплюється з нижньою парою ---- */
async function endSession(title, desc, code) {
  if (state === 'returning') return;
  state = 'returning';
  scanning = false;
  teardownCamera();
  setProgress(0);
  scannerWindow.classList.remove('active');
  showCard(title, desc, code);                    // поле зараз за екраном

  const p0 = slideP, a1 = mainA;
  await tween(700, (p) => {
    const e = easeInOut(p);
    setSlide(p0 * (1 - e));
    mainA = a1 - SLIDE_ROT * p0 * e;
  });
  setSlide(0);

  topCoupled = false;                             // верхня пара зупиняється
  axisTop.classList.add('fade-out');
  const y0 = mainY, a0 = mainA;
  const aEnd = alignedDown(a0 - 300, botA);       // у фазі з нижньою парою
  await tween(1000, (p) => {
    mainY = y0 + (HOME_Y - y0) * easeOutBack(p);
    mainA = a0 + (aEnd - a0) * easeOutCubic(p);
  });
  mainY = HOME_Y; mainA = aEnd;
  botShift = mainA - botA;                        // зчеплення внизу
  bottomCoupled = true;
  axisBottom.classList.remove('fade-out');
  state = 'idle';
  setGearLabel();
}

function finishScan(code) {
  endSession('Номер диска', 'Свайпни вгору або торкнися шестерні для нового сканування', code);
}
function cancelScan() {
  if (state !== 'scanning') return;
  endSession('Система сканування', 'Свайпни вгору або торкнися шестерні для запуску');
}
function abortScan(msg) {
  if (state !== 'scanning') return;
  endSession('Сканування перервано', msg);
}
const toggleScan = () => { if (state === 'idle') launch(); else if (state === 'scanning') cancelScan(); };

/* ---- Керування (миша, дотик, перо): угору запускає, униз вимикає ---- */
stage.addEventListener('pointerdown', (e) => {
  if (state !== 'idle' && state !== 'scanning') return;
  pointerDown = true;
  pointerStartY = e.clientY;
});
window.addEventListener('pointermove', (e) => {
  if (!pointerDown) return;
  const dy = e.clientY - pointerStartY;
  if (state === 'idle' && dy < -20) { pointerDown = false; launch(); }
  else if (state === 'scanning' && dy > 20) { pointerDown = false; cancelScan(); }
});
const releasePointer = () => { pointerDown = false; };
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);

gear1.addEventListener('click', toggleScan);
gear1.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleScan(); }
});

/* ---- Камеру обов'язково відпускаємо, коли сторінку закрито чи згорнуто ---- */
window.addEventListener('pagehide', teardownCamera);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) abortScan('Сторінку згорнуто, камеру вимкнено. Запусти сканування ще раз.');
});
window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
window.addEventListener('resize', layout);

/* ---- Старт ---- */
scannerWindow.style.setProperty('--travel', CORNER_TRAVEL_PX + 'px');
setGearPath('gear1', 0, HOME_Y, MAIN_TEETH);
BOTTOM.forEach((g) => setGearPath(g.id, g.x, g.y, g.teeth));
layout();
requestAnimationFrame(frame);
startWorker();


</script>
</body>
</html>
